<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园信息系统 · 模块门户</title>
  <link rel="stylesheet" href="./portal.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark">U</span>
      <span>校园信息系统<small>CAMPUS INFORMATION SYSTEM</small></span>
    </div>
    <div class="account">
      <span id="user-name" class="name">加载中…</span>
      <span id="user-role" class="role"></span>
      <span id="user-id" class="uid"></span>
      <button id="logout" type="button">退出</button>
    </div>
  </header>

  <main class="page">
    <div class="page-head">
      <p class="eyebrow">信息系统开发实践 II</p>
      <h1>模块门户</h1>
      <p class="hint">选择一个模块进入。当前身份可使用的模块以卡片状态为准。</p>
    </div>

    <section id="modules" class="grid" aria-label="业务模块"></section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./portal.js"></script>
</body>
</html>
